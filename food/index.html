        <h1 class="project-title">Food</h1>

        <p class="project-description">
          I love experimenting with different cuisines that I have picked growing up and during my travels. From family. Friends. And strangers. Sometimes, I mimic food that I enjoyed in restaurants. Other times, I cook food from cultures that I am curious about.
